<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — NOCS merdeka.net.id</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b27;
    --surface2: #1c2333;
    --border: #253047;
    --border2: #2d3a52;
    --text: #e2e8f4;
    --muted: #a0aec0;
    --muted2: #718096;
    --accent: #3b82f6;
    --accent-dim: rgba(59,130,246,0.12);
    --accent-glow: rgba(59,130,246,0.30);
    --danger: #ef4444;
    --ok: #10b981;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'Inter', sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
  }

  /* Grid background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(59,130,246,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(59,130,246,0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .page {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    position: relative;
    z-index: 1;
  }

  .brand {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    margin-bottom: 40px;
  }
  .brand-icon {
    width: 48px;
    height: 48px;
    background: var(--accent-dim);
    border: 1px solid var(--accent);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 20px var(--accent-glow);
  }
  .brand-icon svg { width: 26px; height: 26px; stroke: var(--accent); fill: none; stroke-width: 1.8; }
  .brand-name {
    font-family: var(--mono);
    font-size: 22px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: 0.04em;
  }
  .brand-sub {
    font-size: 12px;
    color: var(--muted2);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 36px 40px;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.4);
  }
  .card-title {
    font-size: 18px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 4px;
  }
  .card-sub {
    font-size: 13px;
    color: var(--muted2);
    margin-bottom: 28px;
  }

  .form-group {
    margin-bottom: 18px;
  }
  .form-label {
    display: block;
    font-size: 12px;
    font-weight: 500;
    color: var(--muted);
    margin-bottom: 6px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .form-input {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border2);
    border-radius: 8px;
    padding: 10px 14px;
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .form-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-dim);
  }
  .form-input::placeholder { color: var(--muted2); }

  .pw-wrap { position: relative; }
  .pw-toggle {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    cursor: pointer;
    color: var(--muted2);
    padding: 0;
    display: flex;
    align-items: center;
  }
  .pw-toggle:hover { color: var(--muted); }
  .pw-toggle svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; }

  .btn-primary {
    width: 100%;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 11px 20px;
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s, box-shadow 0.15s;
    margin-top: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .btn-primary:hover:not(:disabled) {
    background: #2563eb;
    box-shadow: 0 4px 14px var(--accent-glow);
  }
  .btn-primary:active:not(:disabled) { transform: scale(0.98); }
  .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

  .spinner {
    width: 16px; height: 16px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    display: none;
  }
  .btn-primary.loading .spinner { display: block; }
  .btn-primary.loading .btn-text { display: none; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .alert {
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 13px;
    margin-top: 16px;
    display: none;
  }
  .alert.error { background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.3); color: #fca5a5; }
  .alert.success { background: rgba(16,185,129,0.12); border: 1px solid rgba(16,185,129,0.3); color: #6ee7b7; }
  .alert.show { display: block; }

  .footer {
    margin-top: 32px;
    color: var(--muted2);
    font-size: 12px;
    text-align: center;
  }
  .footer span { color: var(--muted); }
</style>
</head>
<body>
<div class="page">
  <div class="brand">
    <div class="brand-icon">
      <svg viewBox="0 0 24 24">
        <path d="M12 2L2 7l10 5 10-5-10-5z"/>
        <path d="M2 17l10 5 10-5"/>
        <path d="M2 12l10 5 10-5"/>
      </svg>
    </div>
    <div class="brand-name">NOCS</div>
    <div class="brand-sub">merdeka.net.id — Network ONU Config System</div>
  </div>

  <div class="card">
    <div class="card-title">Masuk ke Akun</div>
    <div class="card-sub">Masukkan kredensial untuk melanjutkan</div>

    <div class="form-group">
      <label class="form-label" for="username">Username</label>
      <input class="form-input" type="text" id="username" placeholder="Username" autocomplete="username" autofocus>
    </div>

    <div class="form-group">
      <label class="form-label" for="password">Password</label>
      <div class="pw-wrap">
        <input class="form-input" type="password" id="password" placeholder="Password" autocomplete="current-password" style="padding-right: 40px;">
        <button class="pw-toggle" type="button" onclick="togglePw()" title="Tampilkan/sembunyikan password">
          <svg id="eye-icon" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>

    <button class="btn-primary" id="loginBtn" onclick="doLogin()">
      <span class="spinner"></span>
      <span class="btn-text">Masuk</span>
    </button>

    <div class="alert error" id="alertErr"></div>
  </div>

  <div class="footer">
    <span>NOCS</span> v1.0 &mdash; Sistem diproteksi, akses tidak sah dilarang
  </div>
</div>

<script>
  // Jika sudah login, redirect ke halaman utama
  (function() {
    const token = localStorage.getItem('nocs_token');
    if (token) {
      fetch('/api/auth/verify', {
        headers: { 'Authorization': 'Bearer ' + token }
      }).then(r => {
        if (r.ok) window.location.href = '/';
      }).catch(() => {});
    }
  })();

  function togglePw() {
    const inp = document.getElementById('password');
    const icon = document.getElementById('eye-icon');
    if (inp.type === 'password') {
      inp.type = 'text';
      icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
    } else {
      inp.type = 'password';
      icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
    }
  }

  function showErr(msg) {
    const el = document.getElementById('alertErr');
    el.textContent = msg;
    el.className = 'alert error show';
  }

  function hideAlert() {
    document.getElementById('alertErr').className = 'alert error';
  }

  async function doLogin() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const btn = document.getElementById('loginBtn');

    if (!username || !password) {
      showErr('Username dan password wajib diisi');
      return;
    }

    hideAlert();
    btn.classList.add('loading');
    btn.disabled = true;

    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();

      if (data.success) {
        localStorage.setItem('nocs_token', data.token);
        localStorage.setItem('nocs_user', JSON.stringify({ username: data.username, role: data.role }));
        // Jika ada ?redirect= di URL, ikuti itu. Kalau tidak, arahkan berdasarkan role
        const redirect = new URLSearchParams(window.location.search).get('redirect');
        if (redirect) {
          window.location.href = redirect;
        } else {
          window.location.href = data.role === 'admin' ? '/admin.html' : '/';
        }
      } else {
        showErr(data.message || 'Login gagal');
        btn.classList.remove('loading');
        btn.disabled = false;
      }
    } catch(e) {
      showErr('Tidak dapat terhubung ke server');
      btn.classList.remove('loading');
      btn.disabled = false;
    }
  }

  // Enter key
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  });
</script>
</body>
</html>
